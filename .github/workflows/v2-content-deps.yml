name: V2 content dependencies

on:
  push:
    branches:
      - feat/v2-pdf-ico
    paths:
      - .github/workflows/v2-content-deps.yml

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-pdf-ico
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install V2 browser libraries
        run: |
          npm install marked@latest turndown@latest dompurify@latest pdfjs-dist@latest
          npm install --save-dev @types/turndown@latest
      - run: npm audit --audit-level=high
      - name: Verify project
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Commit dependencies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
          else
            git commit -m "feat(v2): add PDF rendering and text conversion libraries"
            git fetch origin feat/v2-pdf-ico
            git rebase origin/feat/v2-pdf-ico
            git push origin HEAD:feat/v2-pdf-ico
          fi
