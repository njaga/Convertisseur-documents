name: V2 dependency setup

on:
  push:
    branches:
      - feat/v2-pdf-ico
    paths:
      - .github/workflows/v2-deps.yml

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
        with:
          ref: feat/v2-pdf-ico

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add pdf-lib
        run: npm install pdf-lib@latest

      - name: Verify dependency audit
        run: npm audit --audit-level=high

      - name: Verify existing project
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
          else
            git commit -m "feat(v2): add pdf-lib for local PDF tools"
            git push origin HEAD:feat/v2-pdf-ico
          fi
