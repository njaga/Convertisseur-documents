name: Dependency refresh

on:
  push:
    branches:
      - fix/conversion-engine-hardening
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/conversion-engine-hardening

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Ensure clean dependencies
        run: npm uninstall axios sharp @types/sharp || true

      - name: Install test runner
        run: npm install --save-dev vitest@latest

      - name: Update package metadata and scripts
        run: |
          npm pkg set name="convertisseur-documents"
          npm pkg set engines.node=">=22.12.0"
          npm pkg set scripts.typecheck="tsc -b --pretty false"
          npm pkg set scripts.test="vitest run"

      - name: Audit
        run: npm audit --audit-level=high

      - name: Verify project
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Commit test tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "test: add Vitest and project scripts"
            git push origin HEAD:fix/conversion-engine-hardening
          fi

      # One-shot maintenance workflow. Remove after this successful refresh.
