name: Dependency refresh

on:
  push:
    branches:
      - fix/conversion-engine-hardening
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/conversion-engine-hardening

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Remove unused dependencies
        run: npm uninstall axios sharp @types/sharp

      - name: Update runtime dependencies
        run: npm install react-router-dom@latest

      - name: Update build and lint toolchain
        run: |
          npm install --save-dev vite@latest @vitejs/plugin-react@latest eslint@latest @eslint/js@latest typescript-eslint@latest eslint-plugin-react-hooks@latest eslint-plugin-react-refresh@latest globals@latest

      - name: Apply compatible audit fixes
        run: npm audit fix || true

      - name: Show remaining audit findings
        run: npm audit --audit-level=high || true

      - name: Verify project
        run: |
          npm run lint
          npx tsc -b --pretty false
          npm run build

      - name: Commit dependency refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "chore: modernize build dependencies"
            git push origin HEAD:fix/conversion-engine-hardening
          fi

      # One-shot maintenance workflow: remove after the dependency refresh is committed.
