name: Dependency refresh

on:
  push:
    branches:
      - fix/conversion-engine-hardening
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/conversion-engine-hardening

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Remove unused Axios
        run: npm uninstall axios

      - name: Update React Router to a patched release
        run: npm install react-router-dom@latest

      - name: Update Sharp and keep it development-only
        run: |
          npm uninstall sharp
          npm install --save-dev sharp@^0.35.3

      - name: Apply non-breaking audit fixes
        run: npm audit fix || true

      - name: Show remaining audit findings
        run: npm audit --audit-level=high || true

      - name: Verify project
        run: |
          npm run lint
          npx tsc -b --pretty false
          npm run build

      - name: Commit lockfile refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "chore: refresh vulnerable dependencies"
            git push origin HEAD:fix/conversion-engine-hardening
          fi

      # One-shot maintenance workflow: remove after the dependency refresh is committed.
